const historySections = [
 {heading:'Uma trajetória a partir dos anos 60',intro:'A existência da Clínica Hamburguesa de Anestesiologia remonta muito antes da data de sua fundação em 1988. Ela é a culminância da trajetória profissional de médicos que foram os precursores da prática da anestesia na cidade de Novo Hamburgo e em muitos municípios circunvizinhos:',items:[
  'Em 1º de novembro de 1961, o Dr. Werner Victor Dudzig, com especialidade médica em anestesia, realizou a primeira anestesia na cidade de Novo Hamburgo. Antes disso, médicos de cidades vizinhas e freiras realizavam os procedimentos de sedação;',
  'Unindo-se a ele e a seu convite, começou a atuar a partir de 1962, o Dr. Hélio Rist Dias, formado em 1961 pela UFRGS, ambos reconhecidos em todo o Rio Grande do Sul como profissionais especializados em anestesia e por suas atuações nos hospitais Regina e Operário (atual Hospital Geral);',
  'Nessa época, todos os médicos realizavam procedimentos anestésicos, apesar de já existirem cursos específicos na área.',
  'Em 1965, o Dr. Hélio ingressou como membro da Sociedade Brasileira de Anestesia;',
  'Próximo a 1965, os doutores Ivon Andreoli e Jorge Roberto Azambuja Santos juntam-se aos doutores Hélio e Werner, suprindo as necessidades de anestesia nas cidades de Estância Velha, Dois Irmãos e Ivoti;',
  'Em dezembro de 1976, faleceu Dr. Dudzig e o Dr. Hélio passou a atuar sozinho nos hospitais de Novo Hamburgo;',
  'Em 1977, o Dr. Hélio se reuniu aos doutores Ivon e Jorge. Assim, eles passaram a atuar como uma equipe, atendendo as demandas da região pelos próximos 11 anos;',
  'Durante esse período, alguns médicos ingressaram na equipe: os doutores Gilson Kern, Marco Antônio Ribeiro, Rubens Castelan e Paulo Marques Schild;',
  'Em 1988, nasce a Clínica Hamburguesa de Anestesiologia, agora juridicamente formada, integrando seis médicos anestesistas;',
  'Neste ano, o Dr. Sergio Dudzig (filho do falecido Dr. Werner) foi chamado pelo antigo parceiro do seu pai – Dr. Hélio – para trabalhar na clínica.'
 ]},
 {heading:'Uma ação consistente desde 1988',intro:'A constituição da Clínica Hamburguesa de Anestesiologia em 1988 impulsionou sobremaneira as ações dos médicos anestesistas na cidade de Novo Hamburgo. A partir de sua fundação e a medida que os serviços públicos e privados da área da saúde foram se desenvolvendo no município, o papel do anestesista nos procedimentos cirúrgicos foi amplamente reconhecido. Isto porque, os profissionais envolvidos se mostraram dispostos a buscar novos conhecimentos, tecnologias e medicamentos para realizar os procedimentos mais avançados pari passu com os centros médicos internacionais:',items:[
  'Durante os anos 80, em relação ao exercício da profissão, vários avanços foram alcançados no âmbito da medicina anestesiológica – desde as formas de administração dos medicamentos durante as cirurgias, até a incorporação de modernas aparelhagens que garantem controle, precisão e eficácia durante as intervenções cirúrgicas;',
  'Entre as melhorias tecnológicas está a monitorização de administração de drogas – fundamental para medir a quantidade ideal de anestésicos a serem ministrados nos pacientes; aparelhos de ventilação; o oxímetro – para determinar a oxigenação do sangue próximo ao estado natural;',
  'Paralelo a isto, nesta década, foram incorporados sistemas para monitorar o estado dos pacientes durante os processos cirúrgicos, garantindo assim, pleno controle da ação anestésica durante os procedimentos;',
  'Em 1990, a Clínica Hamburguesa de Anestesiologia passa a atuar no Hospital São Rafael – atual Hospital Unimed em Novo Hamburgo.',
  'Em 1994, o Dr. Hélio Rist Dias assume a administração da Clínica.',
  'Em 2000, saída do Dr. Marco Antônio.',
  'Em 2012, a Clínica Hamburguesa de Anestesiologia transfere a sua sede para o Centro Clínico Regina – atendendo o hospital Regina através de cerca de 20 convênios da área da saúde e a Unimed Vale do Sinos.'
 ]}

const anestesiaSections=[
 {heading:'Sedação',paragraphs:[
  'A sedação tem o objetivo de reduzir a ansiedade do paciente, “desconectando-o” do ambiente em que ele se encontra. A sedação permite que determinadas cirurgias ou exames sejam realizados confortavelmente pelo paciente.',
  'Utiliza-se medicamentos que podem ser aplicados por via venosa ou inalatória, geralmente são medicamentos que induzem o sono e retiram a ansiedade. A sedação pode ser feita isoladamente como no caso de exames diagnósticos ou associada à anestesia local ou regional para permitir que o paciente permaneça tranquilo durante o ato cirúrgico.',
  'Apesar da sedação ser considerada uma anestesia mais superficial, este conceito é equivocado pois existem vários niveis de sedação podendo ser do superficial ao profundo; neste caso o paciente pode necessitar de assistência ventilatória de forma semelhante a uma anestesia geral.'
 ]},
 {heading:'Anestesia Geral',paragraphs:[
  'A anestesia geral consta de hipnose, analgesia e imobilidade, ou seja, o paciente deve estar dormindo, sem dor e sem apresentar movimentos. Durante a anestesia geral demanda-se a assistência ventilatória já que a anestesia geral implica em algum tipo de ajuda para o paciente respirar, com o uso de cânulas, máscaras especiais (máscaras faciais ou máscaras laríngeas), tubos traqueais (sondas que são passadas dentro da traquéia).',
  'A respiração pode ser espontânea, quando controlada pelo próprio paciente, ou artificial, quando controlada pelo aparelho de anestesia.',
  'A anestesia geral pode ser realizada através da injeção de medicamentos na veia (anestesia geral venosa) ou através da inalação de gases anestésicos (anestesia geral inalatória). Mais freqüentemente utiliza-se ambas as técnicas combinadas (anestesia geral balanceada). Ocasionalmente associa-se também algum tipo de bloqueio à anestesia geral, geralmente objetivando reduzir a dor no pós-operatório. Os medicamentos podem ser administrados continuamente ou em doses fracionadas.',
  'Em crianças frequentemente inicia-se a anestesia de forma inalatória, através do uso de máscara com gás anestésico, para evitar a punção da veia com a criança acordada. Desta forma a punção é realizada após a criança perder a consciência. Nas crianças maiores e colaborativas pode ser puncionada a veia e feita a indução da anestesia de forma intra-venosa.'
 ]},
 {heading:'Bloqueios',paragraphs:[
  'Os bloqueios são anestesias em que uma determinada parte do corpo fica anestesiada. São utilizados geralmente para cirurgias de membros (braços e pernas) e parte inferior do abdômen. Quando aplicados na região da coluna espinhal são denominados bloqueios do neuroeixo; quando aplicados em outras regiões do corpo são denominados bloqueios periféricos.',
  'Os bloqueios do neuroeixo podem ser de dois tipos: Raquianestesia e Anestesia Peridural.',
  'Estas técnicas diferem entre sí pelo local onde se aplica o anestésico (na anestesia peridural o anestésico é depositado no espaço peridural e na raquianestesia o anestésico é injetado dentro da membrana subaraquinoidea), a quantidade de anestésico aplicado é maior na peridural do que na raquianestesia.',
  'Na anestesia para parto normal podem ser utilizadas ambas as técnicas, porém a quantidade de anestésico utilizada é muito pequena, de forma a permitir que a gestante continue se movimentando, não interferindo com a evolução do trabalho de parto.',
  'Os bloqueios periféricos são realizados através da injeção de anestésicos locais no trajeto de nervos e geralmente são indicados para cirurgias de braço, mão, pé, etc.',
  'Os bloqueios são freqüentemente realizados com o paciente sedado, de forma a promover maior conforto. Por este motivo, muitas vezes o paciente nem se lembra do momento da aplicação.'
 ]}
];

 {heading:'O pós-operatório',intro:'Atenção aos cuidados após a cirurgia:',items:[
  'Pergunte ao seu médico sobre o horário de alimentar-se novamente;',

  'O uso de anestésicos e remédios para a dor com o estômago vazio podem provocar náuseas ou vômitos. Esta situação normalmente é passageira. Caso os incômodos se agravem, faça contato com o seu médico.',

<section class="social-section light-surface"><div class="wrap"><article class="social-block"><div class="social-number">AMO Criança</div><div><h2>Associação de Assistência em Oncopediatria</h2><p>A Associação de Assistência em Oncopediatria – AMO Criança é uma entidade de apoio à crianças portadoras de câncer. Atuando na área há 15 anos, a entidade visa promover a saúde e tratamento de crianças e adolescentes, na faixa etária de 0 a 18 anos, com atendimento a saúde física, psíquica e social proporcionando melhoria na sua qualidade de vida e de seus familiares.</p><h3>Direcione parte do seu Imposto de Renda para o seu projeto social preferido</h3><p>Pessoa física poderá doar até 3% do Imposto de Renda devido. O pagamento será em DARF, valor calculado pelo software do Imposto de Renda, e sua doação será declarada automaticamente.</p><h3>Passo a passo</h3><ul class="editorial-list"><li>No RESUMO DA DECLARAÇÃO, escolher a opção DOAÇÃO DIRETAMENTE NA DECLARAÇÃO – ECA;</li><li>O valor a doar será calculado automaticamente. Para emissão do DARF, na opção IMPRIMIR, escolher “DARF – DOAÇÕES DIRETAMENTE DA DECLARAÇÃO – ECA”, e recolher até a data limite;</li><li>Importante: Para que a sua associação seja beneficiada pelas doações diretas na declaração, será necessário enviar cópia do documento, DARF PAGO, com a indicação do Projeto escolhido para a entidade beneficiada.</li></ul><p class="source-note">As informações tributárias desta seção foram reproduzidas do site antigo e exigem validação conforme as regras atuais da Receita Federal.</p></div></article><article class="social-block"><div class="social-number">ONCOSUS</div><div><h2>Atendimento oncológico</h2><p>É um serviço disponibilizado para os pacientes com câncer que necessitam de tratamento quimioterápico e eventuais internações por complicações da própria doença. O Hospital Regina está credenciado pelo Sistema Único de Saúde para atendimento aos pacientes oncológicos como UNACON (Unidade de Assistência de Alta Complexidade em Oncologia), com abrangência para os seguintes municípios: Novo Hamburgo, Campo Bom, Estância Velha, Ivoti e Dois Irmãos.</p></div></article></div></section>${waCta()}`}

function setupListeners(){const menu=$('#mobile-toggle');if(menu)menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')==='true';menu.setAttribute('aria-expanded',String(!open));menu.setAttribute('aria-label',open?'Abrir menu':'Fechar menu');$('#mobile-menu').classList.toggle('is-open',!open);document.body.classList.toggle('menu-open',!open)});$('.mobile-menu')?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{document.body.classList.remove('menu-open')}));document.querySelectorAll('.nav-dropdown>button').forEach(btn=>{btn.addEventListener('click',()=>{const b=btn.getAttribute('aria-expanded')==='true';document.querySelectorAll('.nav-dropdown>button').forEach(el=>el.setAttribute('aria-expanded','false'));btn.setAttribute('aria-expanded',String(!b))})});document.addEventListener('click',closeDropdowns,{once:true});document.querySelectorAll('[data-anchor]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}));const input=$('#team-search');if(input){input.addEventListener('input',()=>{let q=input.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let total=0;document.querySelectorAll('.team-card').forEach(card=>{const show=card.dataset.search.includes(q);card.hidden=!show;if(show)total++});$('#search-count').textContent=q?`${total} ${total===1?'profissional encontrado':'profissionais encontrados'}`:'';$('#no-results').hidden=total>0})}}
function closeDropdowns(e){if(!e?.target?.closest?.('.nav-dropdown'))document.querySelectorAll('.nav-dropdown>button').forEach(el=>el.setAttribute('aria-expanded','false'))}
let observer;
function setupReveal(){observer?.disconnect();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;observer=new IntersectionObserver(items=>items.forEach(item=>{if(item.isIntersecting){item.target.classList.add('in-view');observer.unobserve(item.target)}}),{threshold:.06,rootMargin:'0px 0px -25px 0px'});document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.setProperty('--i',i%3);observer.observe(el)});}
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;$('#top-progress')?.style.setProperty('transform',`scaleX(${max>0?Math.min(1,scrollY/max):0})`);$('#site-header')?.classList.toggle('scrolled',scrollY>24)}
window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('hashchange',()=>{document.body.classList.remove('menu-open');render();updateProgress()});
let threeRaf,threeRenderer;
async function setupThree(){cancelAnimationFrame(threeRaf);if(threeRenderer){threeRenderer.dispose();threeRenderer=null}if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||window.innerWidth<1000)return;const canvas=$('#hero-three');if(!canvas)return;try{const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js');if(!document.contains(canvas))return;const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'});threeRenderer=renderer;const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(45,1,.1,200);camera.position.z=12;const pts=[],cols=[];for(let i=0;i<370;i++){const t=i/369*Math.PI*10;const r=2.2+Math.sin(t*.6)*.5;pts.push(Math.cos(t)*r,Math.sin(t)*r,(i/369-.5)*8);const c=new THREE.Color(i%7===0?'#f8dfa0':'#d3b26d');cols.push(c.r,c.g,c.b)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const material=new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.75,depthWrite:false});const points=new THREE.Points(g,material);scene.add(points);let width=0,height=0;let last=0;function tick(time){if(!document.contains(canvas)){renderer.dispose();return}if(time-last>33){last=time;const rect=canvas.getBoundingClientRect();if(rect.width!==width||rect.height!==height){width=rect.width;height=rect.height;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix()}points.rotation.x=.1+scrollY*.00008;points.rotation.y=time*.000045;renderer.render(scene,camera)}threeRaf=requestAnimationFrame(tick)}threeRaf=requestAnimationFrame(tick)}catch(e){canvas.style.display='none'}}
render();updateProgress();
